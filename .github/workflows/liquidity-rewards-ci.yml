name: Liquidity Rewards CI

on:
  push:
    branches: [main]
    paths:
      - 'src/liquidity-rewards/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jsconfig.json'
      - '.github/workflows/liquidity-rewards-ci.yml'
  pull_request:
    paths:
      - 'src/liquidity-rewards/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jsconfig.json'
      - '.github/workflows/liquidity-rewards-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install type checker
        run: npm ci --no-audit --no-fund
      - name: Type-check Liquidity Rewards
        run: npm run typecheck
      - name: Run Liquidity Rewards tests
        run: npm test
